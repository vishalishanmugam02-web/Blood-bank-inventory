<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>🩸 BloodBank User</b><button onclick="logout()">Logout</button></nav><main class="dashboard"><h1>User Dashboard</h1><div class="grid" id="stockCards"></div><section class="panel"><h2>Request Blood Units</h2><form id="issueForm" class="formgrid"><input id="recipientName" placeholder="Recipient name" required><select id="bloodGroup" required><option value="">Blood Group</option><option>A_POSITIVE</option><option>A_NEGATIVE</option><option>B_POSITIVE</option><option>B_NEGATIVE</option><option>AB_POSITIVE</option><option>AB_NEGATIVE</option><option>O_POSITIVE</option><option>O_NEGATIVE</option></select><input id="unitsIssued" type="number" min="1" value="1" placeholder="Units" required><button class="btn user" type="submit">Submit Request</button></form><div id="issueMsg" class="message"></div></section><section class="panel"><h2>Important Rule</h2><p>Only units that are available and have more than 7 days remaining before expiry can be issued. Expired and near-expiry units are automatically excluded.</p></section></main><script src="/js/user.js"></script></body></html>
